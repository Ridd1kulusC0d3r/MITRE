name: monitor

# Relatório mensal: sinais de manutenção dos repositórios do catálogo e
# aviso de nova versão do ATT&CK. Não altera o repositório; o resultado
# aparece no resumo da execução (aba Actions).
on:
  schedule:
    - cron: "17 11 1 * *"   # dia 1, 08:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nova versão do ATT&CK?
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, urllib.request
          idx = json.load(urllib.request.urlopen("https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/index.json"))
          cat = json.load(open("data/ecosystem.json"))
          atual = next(e["version"] for e in cat["entries"] if e["id"] == "E001").split()[0].lstrip("v")
          print("## ATT&CK\n")
          for c in idx["collections"]:
              v = c["versions"][0]
              flag = "🆕 **nova versão — atualizar o catálogo**" if v["version"] != atual else "em dia"
              print(f"- {c['name']}: {v['version']} ({v['modified'][:10]}) — catálogo: {atual} · {flag}")
          print()
          EOF
      - name: Sinais de manutenção
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_repos.py >> "$GITHUB_STEP_SUMMARY"
