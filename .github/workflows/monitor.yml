name: monitor

# Semanal: versão do ATT&CK contra o catálogo e sinais de manutenção dos
# repositórios. Quando há algo a fazer, abre (ou atualiza) uma issue com o
# rótulo "monitor"; o relatório completo também vai para o resumo da execução.
on:
  schedule:
    - cron: "17 11 * * 1"   # segunda, 08:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Relatório e issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/monitor.py --issue
