name: validate

# Valida a FONTE (data/entries, vocab, trilha, design/tokens.json), roda os testes
# e faz um build de fumaça. Não exige derivados em dia: quem os grava é o publish.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fonte válida
        run: python3 -m atlas check
      - name: Testes
        run: python3 -m unittest -v
      - name: Build de fumaça (em dist/, descartado)
        run: python3 -m atlas build --out dist && python3 -m atlas site _site
      - name: Scripts compilam e shell sem erro de sintaxe
        run: |
          python3 -m py_compile scripts/*.py
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Camadas do Navigator legíveis
        run: for f in layers/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: PR não edita derivados à mão
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # PR só de fonte: passa (o publish gera os derivados depois do merge).
          # PR que toca derivados: eles precisam ser exatamente o que o build produz;
          # isso reprova edição à mão e aceita PRs que mudam o próprio build.
          changed=$(git diff --name-only "$BASE"...HEAD)
          touched=$(python3 -m atlas generated | grep -Fxf - <(echo "$changed") || true)
          [ -z "$touched" ] && { echo "PR não toca em derivados."; exit 0; }
          if ! python3 -m atlas build --check; then
            echo "::error::Este PR altera arquivos gerados que não batem com o build:"; echo "$touched"
            echo "Edite só a fonte (data/entries/, data/*.json, design/). Para desfazer:"
            echo "  git checkout origin/${{ github.base_ref }} -- $(echo $touched)"
            echo "Ou regenere tudo com: python3 -m atlas build"
            exit 1
          fi
